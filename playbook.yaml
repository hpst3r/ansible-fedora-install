---
- name: Configure workstations
  hosts: workstations
  roles:
    - onepassword
    - tailscale
    - role: gnome
      vars:
        gnome_set_interface_font: false
        gnome_set_document_font: false
        gnome_set_monospace_font: false
    - vscode
    - graphics_driver
    - rpmfusion
    - ffmpeg_swap
    - role: quiet_boot
      vars:
        quiet_boot_enabled: false
  vars_files:
    - vars/rpm_packages.yaml
    - vars/dnf_groups.yaml
    - vars/flatpak_packages.yaml

  tasks:

    - name: Update the system
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true

    - name: Install individual rpm packages
      become: true
      ansible.builtin.dnf:
        name: "{{ rpm_packages }}"
        state: present

    - name: Install package groups
      become: true
      ansible.builtin.dnf:
        name: "@{{ item }}"
        state: present
      loop: "{{ dnf_groups }}"

    - name: Install flatpaks
      become: true
      community.general.flatpak:
        name: "{{ flatpak_packages }}"
        state: present
