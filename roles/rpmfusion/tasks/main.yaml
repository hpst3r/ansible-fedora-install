---
- name: Add RPM GPG key for rpmfusion free repository
  become: true
  ansible.builtin.rpm_key:
    fingerprint: "E9A491A3DE247814E7E067EAE06F8ECDD651FF2E"
    key: "https://rpmfusion.org/keys?action=AttachFile&do=get&target=RPM-GPG-KEY-rpmfusion-free-fedora-2020"
    state: present
    validate_certs: true
  when: "enable_free"

- name: Enable rpmfusion free repository
  become: true
  ansible.builtin.dnf:
    name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
  when: "enable_free"

- name: Add RPM GPG key for rpmfusion nonfree repository
  become: true
  ansible.builtin.rpm_key:
    fingerprint: "79BDB88F9BBF73910FD4095B6A2AF96194843C65"
    key: "https://rpmfusion.org/keys?action=AttachFile&do=get&target=RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020"
    state: present
    validate_certs: true

- name: Enable rpmfusion nonfree repository
  become: true
  ansible.builtin.dnf:
    name: "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
  when: "enable_nonfree"