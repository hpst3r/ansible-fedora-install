---
- name: Swap ffmpeg-free for ffmpeg
  become: true
  ansible.builtin.command: 'dnf swap {{ ffmpeg_swap_ffmpeg_free_package }} {{ ffmpeg_swap_ffmpeg_nonfree_package }} --allowerasing -y'
- name: update multimedia group
  become: true
  ansible.builtin.command: 'dnf update @multimedia --setopt="install_weak_deps=False" --exclude=PackageKit-gstreamer-plugin -y'
